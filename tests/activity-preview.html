<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка игровых механик</title><link rel="stylesheet" href="../assets/css/base.css"><link rel="stylesheet" href="../assets/css/minigames.css"><link rel="stylesheet" href="../assets/css/toon.css"><style>body{padding:24px;background:#e8f2fb}main{max-width:1000px;margin:auto}#game{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}h1{font-size:2rem}#test-status{padding:12px;color:#7964a3}@media(max-width:600px){#game{grid-template-columns:1fr 1fr}}</style><body><main><h1>Проверка игровых механик</h1><p id="test-status" role="status">Выберите задание</p><div id="mode"></div><div id="game"></div><button id="restart" hidden></button></main><dialog id="dialog"></dialog><script src="../assets/js/game.js"></script><script src="../assets/js/game-art.js"></script><script src="../assets/js/activity-kit.js"></script><script src="../assets/js/minigames.js"></script><script>
const completed=new Set();Game.root.innerHTML=Object.entries(MiniGames.names).map(([id,name])=>`<button class="toon-button" data-test-activity="${id}">${name}</button>`).join('');
document.querySelectorAll('[data-test-activity]').forEach(b=>b.onclick=()=>MiniGames.open({type:b.dataset.testActivity,difficulty:3,variant:5,reward:40,onComplete:()=>{completed.add(b.dataset.testActivity);b.textContent='✓ '+MiniGames.names[b.dataset.testActivity];document.querySelector('#test-status').textContent='Завершено: '+completed.size+' / 30 · '+MiniGames.names[b.dataset.testActivity];}}));Game.dialog.addEventListener('click',e=>{if(e.target===Game.dialog||e.target.closest('[data-close]'))Game.close();});
</script></body></html>
